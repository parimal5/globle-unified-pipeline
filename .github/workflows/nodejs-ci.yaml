
name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        required: false
        type: string
        default: '22'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Node.js project
        uses: parimal5/globle-unified-pipeline/actions/setup-node-project@main
        with:
          node-version: ${{ inputs.node-version }}
      
      - name: Run ESLint
        run: | 
          echo "Running Linting"
          npm run lint

      - name: Run tests
        run: npm test
      
